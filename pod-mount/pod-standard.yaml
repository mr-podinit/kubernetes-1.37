apiVersion: v1
kind: Pod
metadata:
  name: pod-tmp-standard
spec:
  terminationGracePeriodSeconds: 0
  volumes:
  - name: tmp
    emptyDir:
      medium: Memory
  containers:
  - name: pod
    image: alpine:latest
    command: ["sh", "-c", "echo Hello Kubernetes! && sleep infinity"]
    securityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    volumeMounts:
    - name: tmp
      mountPath: /upload
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-tmp-with-noexec
spec:
  terminationGracePeriodSeconds: 0
  volumes:
  - name: tmp
    emptyDir: 
      medium: Memory
  containers:
  - name: pod
    image: alpine:latest
    command: ["sh", "-c", "echo Hello Kubernetes! && sleep infinity"]
    securityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    volumeMounts:
    - name: tmp
      mountPath: /upload
      bindMountOptions: [noexec, nosuid]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-tmp-with-noexec-unsupported
spec:
  terminationGracePeriodSeconds: 0
  volumes:
  - name: tmp
    emptyDir: 
      medium: Memory
  containers:
  - name: pod
    image: alpine:latest
    command: ["sh", "-c", "echo Hello Kubernetes! && sleep infinity"]
    securityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    volumeMounts:
    - name: tmp
      mountPath: /upload
      bindMountOptions: [noexec, nosuid]
  nodeSelector:
    kubernetes.io/hostname: master
  tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"