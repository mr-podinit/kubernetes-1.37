apiVersion: v1
kind: Pod
metadata:
  name: hostname-standard
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: pod
    image: alpine:latest
    command: ["sh", "-c", "echo Hello Kubernetes! && sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: hostname-fqdn
spec:
  terminationGracePeriodSeconds: 0
  setHostnameAsFQDN: true
  containers:
  - name: pod
    image: alpine:latest
    command: ["sh", "-c", "echo Hello Kubernetes! && sleep infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: hostname-override
spec:
  terminationGracePeriodSeconds: 0
  hostnameOverride: www.angeloxx.ch
  containers:
  - name: pod
    image: alpine:latest
    command: ["sh", "-c", "echo Hello Kubernetes! && sleep infinity"]